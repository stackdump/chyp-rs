[package]
name = "chyp-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "An unofficial Rust port of part of Chyp (https://github.com/akissinger/chyp, commit 3d28483): string-diagram rewriting and proof checking for native and wasm32"
publish = false

[lib]
name = "chyp_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "chyp-rs"
path = "src/bin/chyp-rs.rs"

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Must equal the version of the installed wasm-bindgen CLI (see Makefile).
wasm-bindgen = "=0.2.129"

[profile.release]
lto = true
codegen-units = 1

# Size-optimised profile used for the wasm bundle (`make wasm`).
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true
